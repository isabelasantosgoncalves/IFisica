{% extends "base.html" %}

{% block titulo %}Entrar | IFísica{% endblock %}

{% block estilos %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/estiloLogin.css') }}">
{% endblock %}

{% block conteudo %}
<div class="ladoalado">
    {% include "_marca.html" %}
    <h2>IFísica <br> para docentes</h2>
</div>

<form id="formLogin" class="container" novalidate>
    <fieldset>
        <legend>Login</legend>

        <div class="linha">
            <label for="email">E-mail:</label>
            <input id="email" name="email" type="email" size="50" required>
        </div>

        <div class="linha">
            <label for="senha">Senha:</label>
            <input id="senha" name="senha" type="password" required>
        </div>

        <span id="aviso" class="aviso"></span>

        <div class="botoes">
            <a href="{{ url_for('pagina.index') }}">
                <button type="button">Voltar</button>
            </a>
            <input type="submit" value="Entrar">
        </div>
    </fieldset>
</form>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/login.js') }}"></script>
{% endblock %}
